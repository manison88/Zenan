name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - claude/truck-fleet-management-GPylo
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or commit SHA to deploy"
        required: false
        default: ""

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build (Next.js production)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Deploy to Cloudflare Workers
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx opennextjs-cloudflare build
          npx opennextjs-cloudflare deploy 2>&1 | tee /tmp/deploy.log
          VERSION_ID=$(grep -oE "Current Version ID: [a-f0-9-]+" /tmp/deploy.log | awk '{print $4}' | tail -1)
          echo "version_id=$VERSION_ID" >> "$GITHUB_OUTPUT"

      - name: Verify deployment shipped
        if: success()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # wrangler prints deployments oldest-first, so the *last* Version(s)
          # line is the newest deployment. Earlier `grep -m1` grabbed the
          # oldest one and produced a false-negative.
          LATEST=$(npx wrangler deployments list --name zenan-fleet 2>&1 | grep "Version(s):" | tail -1 | grep -oE "[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}")
          EXPECTED="${{ steps.deploy.outputs.version_id }}"
          echo "Expected version: $EXPECTED"
          echo "Latest on Cloudflare: $LATEST"
          if [ -z "$EXPECTED" ]; then
            echo "::error::Could not parse version ID from deploy output"
            exit 1
          fi
          if [ "$EXPECTED" != "$LATEST" ]; then
            echo "::error::Deploy output version ($EXPECTED) does not match latest deployment on Cloudflare ($LATEST). Worker did not actually update."
            exit 1
          fi
          echo "✓ Deployment verified — version $LATEST is live"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Deploy summary"
            echo ""
            echo "- Ref: \`${{ github.event.inputs.ref || github.ref }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Triggered by: ${{ github.actor }}"
            echo "- Job status: ${{ job.status }}"
            echo "- Worker version: \`${{ steps.deploy.outputs.version_id }}\`"
            echo "- Live URL: https://zenan.312itconsulting.com"
          } >> "$GITHUB_STEP_SUMMARY"
